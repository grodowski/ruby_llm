name: PR

on:
  pull_request:
    # UndercoverCI demo: this PR is stacked on undercover-ci (PR #1), so it
    # targets that branch instead of main. Running the checks here too uploads
    # its coverage, and the uploader reads GITHUB_BASE_REF, so UndercoverCI
    # diffs against undercover-ci and reports only this PR's changes.
    branches: ["main", "undercover-ci"]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: ./.github/workflows/_gitleaks.yml

  lint:
    name: RuboCop
    uses: ./.github/workflows/_lint.yml
    with:
      ruby-version: "4.0"
      bundler-cache: false

  test:
    uses: ./.github/workflows/_test-matrix.yml
    with:
      bundler-cache: false
      full: false
    secrets: inherit
